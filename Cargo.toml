[package]
name = "noisytcp"
version = "0.1.0"
edition = "2021"
description = "NoisyTCP CVE-2026-99288 IPv4 kernel race tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
